extends: ia_binary_20k_whole_spectrum_minimum_50.yaml

project:
  name: ia_binary_20k_all_visits_whole_spectrum_50
  output_dir: ${STRIDER_OUTPUT_DIR}/ia_binary_20k_all_visits_whole_spectrum_50

data:
  # Joint architecture gate: retain every available spectrum while exposing
  # partial histories during training.
  max_visits: all
  training_visit_counts: [3, 4, 6, 8, 12, 16, 24, 32, 48, 64, 96, 128]

training:
  batch_by_visit_count: true
  full_visit_training_fraction: 0.5
  maximum_visits_per_batch: 512
  maximum_squared_visits_per_batch: 16384

evaluation:
  visit_control_repeats: 1
  visit_control_max_objects: 1600
  visit_control_selection: span
  visit_control_counts: [1, 2, 4, 8, 16, 24, 32, 48, 64, 96, 128, all]
