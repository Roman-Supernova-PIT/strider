extends: ia_binary_20k_roman_reference_attention.yaml

project:
  name: binary_test
  output_dir: ${STRIDER_OUTPUT_DIR}/binary_test

reference:
  redshift_chunk_size: 24

training:
  # The Roman-reference model coadds every observation linearly and selects a
  # fixed six-observation sequence before temporal attention. It therefore
  # does not require the quadratic observation-count limit inherited from v3.
  epochs: 2
  batch_size: 16
  benchmark_batch_sizes: [8, 16]
  maximum_visits_per_batch: null
  maximum_squared_visits_per_batch: null
