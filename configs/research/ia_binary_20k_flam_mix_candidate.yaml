extends: ia_binary_20k_recipe_reference.yaml

project:
  name: ia_binary_20k_flam_mix_candidate
  output_dir: ${STRIDER_OUTPUT_DIR}/ia_binary_20k_flam_mix_candidate

training:
  # Twenty percent of source examples use stored FLAM. The remainder is split
  # evenly between fresh reported-error and controlled-background draws.
  observed_flux_fraction: 0.20
  paired_reported_error_fraction: 0.50
  # Do not train on FLAM - SIM_FLAM. It remains an unseen shortcut control.
  observed_flux_blank_family: controlled_background
