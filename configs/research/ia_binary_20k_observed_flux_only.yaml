extends: ia_binary_20k_recipe_reference.yaml

project:
  name: ia_binary_20k_observed_flux_only
  seed: 73031
  output_dir: ${STRIDER_OUTPUT_DIR}/ia_binary_20k_observed_flux_only

training:
  # Diagnostic baseline: learn only from the stored simulated observation.
  # Long-history benchmark items use memory-sized microbatches while gradients
  # still accumulate to the configured 16-object optimization batch.
  batch_by_visit_count: true
  maximum_visits_per_batch: 512
  maximum_squared_visits_per_batch: 16384
  observed_flux_fraction: 1.0
  paired_no_source: false
  paired_reported_error_fraction: 0.0
  noise_scale_augmentation_fraction: 0.0
  evidence_sufficiency_loss_weight: 0.0
  no_source_redshift_loss_weight: 0.0
  no_source_class_loss_weight: 0.0
  validation_view_weights:
    generated: 0.0
    original: 1.0
  checkpoint_metric_view: original

evaluation:
  views: [original]
