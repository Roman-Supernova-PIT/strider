extends: ia_binary_20k.yaml

project:
  name: ia_binary_debug
  output_dir: ${STRIDER_OUTPUT_DIR}/ia_binary_debug

data:
  runtime_object_limits:
    train: 3000
    selection: 1000
    calibration: 500
    test: 150

training:
  epochs: 3
  warmup_epochs: 1
  early_stopping_patience: 3
  num_workers: 8
  benchmark_worker_counts: [8]
  benchmark_batch_sizes: [8, 16]
  benchmark_batches: 20
