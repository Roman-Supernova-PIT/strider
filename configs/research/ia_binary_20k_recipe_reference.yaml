extends: ia_binary_full_from_scratch.yaml

project:
  name: ia_binary_20k_recipe_reference
  output_dir: ${STRIDER_OUTPUT_DIR}/ia_binary_20k_recipe_reference

data:
  prepared_dir: ${STRIDER_DATA_DIR}/ia_binary_20k
  max_objects:
    train: 20000
    selection: 5000
    calibration: 2000
    test: 150

onir:
  bank_path: ${STRIDER_DATA_DIR}/onir/ia_binary_20k.npz

training:
  initial_checkpoint: null
  epochs: 8
  learning_rate: 0.001
  learning_rate_schedule: cosine
  warmup_epochs: 2
  early_stopping_patience: 5
  observed_flux_fraction: 0.0
  noise_scale_augmentation_fraction: 1.0
  noise_scale_range: [0.8, 1.2]
