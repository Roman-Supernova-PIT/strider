extends: ia_binary_20k_coadd_denoise.yaml

project:
  name: ia_binary_20k_coadd_first
  output_dir: ${STRIDER_OUTPUT_DIR}/ia_binary_20k_coadd_first

model:
  # Final rung: preserve within-object brightness evolution without exposing
  # the absolute object scale as an unrestricted class or redshift input.
  relative_brightness_evolution: true
  relative_amplitude_mode: object_normalized_flux
  relative_brightness_initial_scale: 0.0
