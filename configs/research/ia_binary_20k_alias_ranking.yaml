extends: ia_binary_20k_phase_control_main.yaml

project:
  name: ia_binary_20k_alias_ranking
  output_dir: ${STRIDER_OUTPUT_DIR}/ia_binary_20k_alias_ranking

training:
  # This is a matched experiment against ia_binary_20k_phase_control_main.
  # Joint cross-entropy remains the main objective; the small auxiliary term
  # only ranks the truth above the strongest solution at least dz=0.1 away.
  alias_ranking_loss_weight: 0.05
  alias_ranking_minimum_delta_z: 0.1
  alias_ranking_margin: 0.25
