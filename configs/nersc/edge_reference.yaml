extends: roman_reference_bank_full.yaml

project:
  name: edge_reference
  output_dir: ${STRIDER_OUTPUT_DIR}/edge_reference

model:
  # Preserve reliable measurements outside the previous fixed edge cut.
  # Bins with propagated errors above the established quality limit remain
  # excluded so noise cannot dominate a scale-invariant match.
  coadd_maximum_relative_error: 3.0
  coadd_edge_trim_fraction: 0.0

reference:
  bank_path: ${STRIDER_DATA_DIR}/reference/roman_edges.npz
  maximum_relative_coadd_error: 3.0
  edge_trim_fraction: 0.0
  edge_taper_fraction: 0.05
