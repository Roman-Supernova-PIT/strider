extends: ia_binary_full_from_scratch.yaml

project:
  name: grouped_8_20k
  output_dir: ${STRIDER_OUTPUT_DIR}/grouped_8_20k

data:
  class_scheme: grouped_8
  prepared_dir: ${STRIDER_DATA_DIR}/grouped_8_20k
  max_objects:
    train: 20000
    selection: 5000
    calibration: 2000
    test: 150
  minimum_class_counts:
    train: 5
    selection: 1
    calibration: 1
    test: 0
  training_sample_by_block: true

model:
  classes:
    - Ia
    - 91bg
    - Iax
    - H-rich CC
    - stripped-envelope CC
    - SLSN
    - PISN
    - other

onir:
  bank_path: ${STRIDER_DATA_DIR}/onir/grouped_8_20k.npz

training:
  initial_checkpoint: null
  epochs: 15
  learning_rate: 0.001
  learning_rate_schedule: cosine
  warmup_epochs: 2
  early_stopping_patience: 5
