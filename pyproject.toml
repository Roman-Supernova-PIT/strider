[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roman-snpit-strider"
version = "0.2.0"
description = "STRIDER inference for Roman supernova spectral time series"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Mitchell Dixon"}]
dependencies = [
    "astropy>=5.0",
    "cmasher>=1.8",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pillow>=10",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.12.0",
]

[project.scripts]
strider = "strider.cli:main"

[project.urls]
Repository = "https://github.com/mdixon741/strider"
Issues = "https://github.com/mdixon741/strider/issues"

[tool.setuptools.packages.find]
include = ["strider*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = [
    "model: requires the production model file",
]

[tool.ruff]
line-length = 100
target-version = "py311"
