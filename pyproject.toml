[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roman-snpit-strider"
version = "0.3.0.dev0"
description = "Observer-frame transient classification and redshift research tool for Roman-like prism spectra."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Mitchell Dixon"},
  {name = "David Jones"},
  {name = "K. Anumba"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "astropy>=7",
  "cmasher>=1.9",
  "h5py>=3.10",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "Pillow>=10",
  "pyarrow>=18",
  "PyYAML>=6",
  "scikit-learn>=1.5",
  "torch>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff==0.12.0",
]

[project.scripts]
strider = "strider.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
